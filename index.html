<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Subangdaku ES SMEA</title><link rel="stylesheet" href="assets/style.css"></head>
<body data-page="home" data-root="">
<main class="wrap" id="app"></main>
<script src="data/smea.js"></script><script src="assets/app.js"></script>
<script>
var D=SMEA, U=UI, lpnTot=D.lpn.rows.reduce(function(a,r){return a+r[2]+r[3]},0);
var tiles=[
 ["📊","Term 1 SAPM","Mean percentage scores by grade, subject and term component.","sapm/index.html","live"],
 ["🧒","Enrollment","Learners per grade level, Kinder to Grade 6 and SPED.","enrollment.html","live"],
 ["📖","Literacy","CRLA reading profile; PHIL-IRI when reported.","literacy.html","live"],
 ["🍎","Nutrition","Learners with poor nutrition (wasted and severely wasted).","nutrition.html","live"],
 ["🎯","Learner Outcomes","LARDOs, dropouts, and subject failures.","outcomes.html","live"],
 ["🧭","BLICs & Practices","Bottlenecks, lags, issues, concerns and promising practices.","practices.html","live"],
 ["🗂️","Slides","Term 1 SMEA conference decks by subject.","slides.html","live"],
 ["📸","Gallery","Photos from the Term 1 SMEA Conference.","gallery.html","live"]
];
document.getElementById("app").innerHTML=
 U.hero("School Year 2026–2027 · Term 1","SMEA Dashboard","One place for Subangdaku Elementary School's monitoring, evaluation and adjustment results.")+
 '<section class="grid g4">'+
  U.stat(U.fmt(D.enrollment.total),"learners enrolled (incl. SPED)","accent")+
  U.stat(U.fmt(lpnTot),"learners with poor nutrition, "+U.pct(lpnTot,D.lpn.enrolment)+" of Kinder to Grade 6")+
  U.stat(D.blics.length,"BLICs reported")+
  U.stat(D.practices.length,"promising practices reported")+
 '</section>'+
 '<section class="grid g3">'+tiles.map(function(t){
   return '<a class="card tile" href="'+t[3]+'"><span class="ic">'+t[0]+'</span><h3>'+t[1]+'</h3><p>'+t[2]+'</p></a>';
 }).join("")+'</section>'+
 '<section class="card"><h2>Term 1 SMEA Conference</h2><p class="sub">September 18, 2026</p><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px"><img src="assets/photos/conference-02.jpg" alt="Conference title slide" style="width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px"><img src="assets/photos/conference-09.jpg" alt="Teachers attending the conference" style="width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px"><img src="assets/photos/conference-06.jpg" alt="Enrollment profile presented" style="width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px"></div><p><a href="gallery.html">See all photos →</a></p></section>';
</script></body></html>
